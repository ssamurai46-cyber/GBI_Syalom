<style>
:root{
  --gold:#C9A84C;--gold-light:#E8C97A;--deep:#1A1209;--brown:#3D2B0E;
  --cream:#FAF5EC;--cream2:#F2E8D0;--muted:#8B7355;--text:#2C1F0A;
  --white:#FFFFFF;--danger:#C0392B;--success:#27AE60;--sw:252px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;}

/* SPLASH */
#splash{position:fixed;inset:0;background:var(--deep);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;}
#splash img{width:90px;height:90px;border-radius:50%;margin-bottom:18px;animation:pulse 1.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.05);opacity:.85}}
#splash h2{font-family:'Playfair Display',serif;color:var(--gold);font-size:1.4rem;margin-bottom:6px;}
#splash p{color:rgba(255,255,255,0.4);font-size:0.75rem;letter-spacing:.12em;text-transform:uppercase;}
.splash-bar{width:160px;height:3px;background:rgba(201,168,76,0.2);border-radius:2px;margin-top:20px;overflow:hidden;}
.splash-fill{height:100%;background:var(--gold);border-radius:2px;animation:fill 2s ease-in-out infinite;}
@keyframes fill{0%{width:0}70%{width:100%}100%{width:100%}}

/* LOGIN */
#login-wrap{display:none;min-height:100vh;}
.login-left{display:none;}
.login-right{width:100%;background:var(--cream);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:40px 24px;}
@media(min-width:700px){
  #login-wrap{display:none;flex-direction:row;}
  .login-left{flex:1;background:linear-gradient(160deg,var(--deep) 0%,var(--brown) 55%,#2D1F08 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px;position:relative;overflow:hidden;}
  .login-left::before{content:'✞';position:absolute;font-size:280px;color:rgba(201,168,76,0.04);bottom:-50px;right:-30px;line-height:1;}
  .login-right{width:420px;min-height:auto;}
}
.login-brand{text-align:center;position:relative;z-index:1;}
.login-brand-logo{width:108px;height:108px;border-radius:50%;margin:0 auto 16px;border:2px solid rgba(201,168,76,0.35);padding:5px;background:rgba(201,168,76,0.08);overflow:hidden;}
.login-brand-logo img{width:100%;height:100%;object-fit:contain;border-radius:50%;}
.login-brand h1{font-family:'Playfair Display',serif;font-size:2rem;color:var(--white);margin-bottom:4px;}
.login-brand .sub{font-size:0.75rem;color:rgba(255,255,255,0.4);letter-spacing:.14em;text-transform:uppercase;}
.login-brand .pill{display:inline-block;margin-top:18px;background:rgba(201,168,76,0.15);border:1px solid rgba(201,168,76,0.3);color:var(--gold);font-size:0.7rem;padding:5px 14px;border-radius:20px;}
.login-box{width:100%;max-width:360px;}
.login-box h2{font-family:'Playfair Display',serif;font-size:1.6rem;color:var(--text);margin-bottom:4px;}
.login-box .sub2{font-size:0.82rem;color:var(--muted);margin-bottom:24px;}
.lbl{display:block;font-size:0.72rem;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.05em;}
.linput{width:100%;padding:11px 14px;border:1.5px solid var(--cream2);border-radius:9px;font-family:'DM Sans',sans-serif;font-size:0.875rem;background:var(--white);outline:none;transition:border .2s,box-shadow .2s;margin-bottom:14px;}
.linput:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,0.1);}
.login-btn{width:100%;padding:12px;background:var(--gold);color:var(--deep);border:none;border-radius:9px;font-family:'DM Sans',sans-serif;font-size:0.9rem;font-weight:700;cursor:pointer;transition:all .2s;margin-top:4px;}
.login-btn:hover{background:var(--gold-light);}
.login-btn:disabled{opacity:.6;cursor:not-allowed;}
.alert{border-radius:8px;padding:10px 13px;font-size:0.79rem;margin-bottom:12px;display:none;}
.alert.show{display:block;}
.alert-err{background:#FEE2E2;color:#991B1B;border:1px solid #FECACA;}
.alert-ok{background:#D1FAE5;color:#065F46;border:1px solid #A7F3D0;}
.login-hint{font-size:0.7rem;color:var(--muted);text-align:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--cream2);}

/* APP */
#app-wrap{display:none;min-height:100vh;}
.sidebar{width:var(--sw);background:var(--deep);min-height:100vh;position:fixed;left:0;top:0;display:flex;flex-direction:column;z-index:100;border-right:1px solid rgba(201,168,76,0.18);}
.sb-logo{padding:16px 16px 13px;border-bottom:1px solid rgba(201,168,76,0.15);display:flex;align-items:center;gap:10px;}
.sb-logo-img{width:38px;height:38px;border-radius:50%;flex-shrink:0;border:1px solid rgba(201,168,76,0.25);overflow:hidden;background:rgba(201,168,76,0.07);}
.sb-logo-img img{width:100%;height:100%;object-fit:contain;}
.sb-brand h1{font-family:'Playfair Display',serif;font-size:.97rem;color:var(--white);line-height:1.2;}
.sb-brand p{font-size:0.59rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}
.nav{padding:11px 0;flex:1;overflow-y:auto;}
.nav-lbl{font-size:0.59rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);padding:8px 16px 3px;}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 16px;cursor:pointer;color:rgba(255,255,255,0.5);font-size:0.82rem;transition:all .2s;border-left:3px solid transparent;}
.nav-item:hover{color:var(--gold-light);background:rgba(201,168,76,0.07);}
.nav-item.on{color:var(--gold);background:rgba(201,168,76,0.12);border-left-color:var(--gold);font-weight:600;}
.nav-item .ic{font-size:.9rem;width:17px;text-align:center;}
.sb-foot{padding:11px 16px;border-top:1px solid rgba(201,168,76,0.15);}
.db-ind{display:flex;align-items:center;gap:5px;font-size:0.65rem;margin-bottom:4px;justify-content:center;}
.db-ind.on{color:#27AE60;}.db-ind.off{color:#E53E3E;}
.db-dot{width:6px;height:6px;border-radius:50%;animation:blink 2s infinite;}
.db-ind.on .db-dot{background:#27AE60;}.db-ind.off .db-dot{background:#E53E3E;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.sb-foot p{font-size:0.61rem;color:var(--muted);text-align:center;}
.main{margin-left:var(--sw);flex:1;min-height:100vh;display:flex;flex-direction:column;}
.topbar{background:var(--white);border-bottom:1px solid var(--cream2);padding:0 22px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.topbar h2{font-family:'Playfair Display',serif;font-size:1.12rem;color:var(--text);}
.tb-right{display:flex;align-items:center;gap:9px;}
.tb-date{font-size:0.73rem;color:var(--muted);}
.user-btn{display:flex;align-items:center;gap:7px;background:var(--cream);border:1px solid var(--cream2);border-radius:8px;padding:4px 10px 4px 4px;cursor:pointer;transition:border .2s;position:relative;}
.user-btn:hover{border-color:var(--gold);}
.av{width:27px;height:27px;border-radius:6px;background:var(--gold);color:var(--deep);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.74rem;}
.user-name{font-size:0.76rem;font-weight:500;}
.u-menu{position:absolute;top:calc(100% + 6px);right:0;background:var(--white);border:1px solid var(--cream2);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,0.1);min-width:170px;display:none;z-index:200;overflow:hidden;}
.u-menu.open{display:block;}
.u-menu-item{padding:9px 14px;font-size:0.8rem;cursor:pointer;transition:background .15s;display:flex;align-items:center;gap:7px;}
.u-menu-item:hover{background:var(--cream);}
.u-menu-item.red{color:var(--danger);}
.u-menu-item.red:hover{background:#FEE2E2;}
.content{padding:22px;flex:1;}
.page{display:none;}
.page.on{display:block;animation:fadein .3s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}

/* TOOLBAR & BUTTONS */
.toolbar{display:flex;gap:7px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.sbox{flex:1;min-width:160px;padding:8px 12px;border:1px solid var(--cream2);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:0.82rem;background:var(--white);outline:none;transition:border .2s;}
.sbox:focus{border-color:var(--gold);}
